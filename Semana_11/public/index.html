<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinos da Itália</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="border-bottom">
        <nav class="navbar navbar-expand-md container">
            <a class="navbar-brand logo" href="index.html">Destinos da Itália</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#destaques">Destaques</a></li>
                    <li class="nav-item"><a class="nav-link" href="#todos">Todos os destinos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#aluno">Sobre</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container py-4">

        <section id="destaques" class="mb-5">
            <h2 class="titulo-secao">Destinos em destaque</h2>

            <div id="carrossel" class="carousel carousel-dark slide" data-bs-ride="carousel">
                <div id="carrossel-indicadores" class="carousel-indicators"></div>
                <div id="carrossel-itens" class="carousel-inner"></div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carrossel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carrossel" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </section>

        <section id="todos" class="mb-5">
            <h2 class="titulo-secao">Todos os destinos</h2>
            <div id="lista-destinos" class="row"></div>
        </section>

        <section id="aluno">
            <h2 class="titulo-secao">Informações do aluno</h2>
            <div class="row">
                <div class="col-12 col-md-7 mb-3">
                    <h3 class="subtitulo">Sobre</h3>
                    <p id="aluno-sobre"></p>
                </div>
                <div class="col-12 col-md-5">
                    <h3 class="subtitulo">Autoria</h3>
                    <div id="aluno-autoria" class="autoria"></div>
                </div>
            </div>
        </section>

    </main>

    <footer class="border-top py-3 text-center rodape">
        Gustavo Martins de Ávila - DIW - PUC Minas<br>
        Fotos: Wikimedia Commons
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
